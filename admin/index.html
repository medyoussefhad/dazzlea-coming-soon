<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dazzlea Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- Login -->
  <section id="login" class="login" hidden>
    <form class="login-card" id="loginForm" autocomplete="on">
      <img src="/assets/logo/dazzlea-logo-white.png" alt="Dazzlea" class="login-logo">
      <h1>Admin</h1>
      <p class="muted">Manage your case studies, articles and contact details.</p>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn btn-red" type="submit">Sign in</button>
      <p class="form-error" id="loginError" role="alert"></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <aside class="side">
      <img src="/assets/logo/dazzlea-logo-white.png" alt="Dazzlea" class="side-logo">
      <nav class="side-nav">
        <button data-view="work" class="active"><i class="fa-solid fa-briefcase"></i> Work <small>Case studies</small></button>
        <button data-view="insights"><i class="fa-solid fa-newspaper"></i> Insights <small>Articles</small></button>
        <button data-view="site"><i class="fa-solid fa-address-card"></i> Site info <small>Contact, stats &amp; logos</small></button>
        <button data-view="leads"><i class="fa-solid fa-user-plus"></i> Leads <small>Mini CRM</small></button>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> View website</a>
        <button id="logout"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="viewTitle">Work</h2>
          <p class="muted" id="viewHint"></p>
        </div>
        <div class="topbar-actions">
          <span id="dirty" class="dirty" hidden>Unsaved changes</span>
          <button class="btn btn-red" id="publish" disabled><i class="fa-solid fa-cloud-arrow-up"></i> Save &amp; publish</button>
        </div>
      </header>
      <div id="deploy" class="deploy" hidden></div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
